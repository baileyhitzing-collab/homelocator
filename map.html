<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Local search app</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
    <script id="search-js" defer src="https://api.mapbox.com/search-js/v1.2.0/web.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
// y, x
// 34.984661,-85.605181 top most, left most
// -80.754882 right most
//  30.35538 lowest
// 32.998154,-83.514246

<body>
    <div id="map"></div>
    <script>
const token = import.meta.env.VITE_MAPBOX_TOKEN
        const map = new mapboxgl.Map({
            accessToken: token,
            container: 'map', // Container ID
            style: 'mapbox://styles/mapbox/standard', // Map style to use
            center: [-83.51424, 32.99815], // Starting position [lng, lat]
            zoom: 12 // Starting zoom level
        });
        const marker = new mapboxgl.Marker() // initialize a new marker
            .setLngLat([-83.51424, 32.99815]) // Marker [lng, lat] coordinates
            .addTo(map); // Add the marker to the map
        window.addEventListener('load', () => {
            const searchBox = new MapboxSearchBox(); // creates a new SearchBox instance
            searchBox.accessToken = token; // provides your accessToken to Searchbox for requests
            searchBox.options = {
                proximity: [-83.51424, 32.99815], // Coordinates of UC Berkeley campus
                bbox: [
                    [-85.60518, 30.35538], // bounding box southwest corner
                    [-80.75488, 34.98466] // bounding box northeast corner
                ]
            };
            searchBox.placeholder = 'Search for houses in Georgia';
            searchBox.marker = true; // Adds a marker to the map after clicking a search result
            searchBox.mapboxgl = mapboxgl; // connects
            searchBox.componentOptions = {
                allowReverse: true,
                flipCoordinates: true
            };
            map.addControl(searchBox); // Adds searchBox to the Mapbox GL JS control area (top right)
        });
    </script>
</body>

</html>
